# Promethee's overlay windows, under Sway.
#
#   include ~/.config/sway/promethee.conf
#
# `./build.sh --install` drops this file there. The line above is yours to add.
# See wm/hyprland.conf for what these rules are for and what each role is; the
# reasoning is the same compositor to compositor, only the syntax moves.

for_window [app_id="^promethee$" title="^Promethee .+$"] floating enable, sticky enable, border none

# An overlay opening should not take the keyboard. Sway's `no_focus` is the
# per-window way to say so, and it is left to you rather than written here,
# because it is a top level command rather than a `for_window` action:
#
#   no_focus [app_id="^promethee$" title="^Promethee .+$"]
