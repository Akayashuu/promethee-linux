# Promethee's overlay windows, under Hyprland.
#
#   source = ~/.config/hypr/promethee.conf
#
# `./build.sh --install` drops this file there. The line above is yours to add,
# because a build script has no business editing your compositor's config.
#
# The app opens one ordinary window, the dashboard, and a handful of overlays:
# the HUD pill, the chat and quest panels, notifications, the end-of-session
# effect. On Windows and macOS an overlay is always-on-top and places itself;
# on Wayland it is a toplevel like any other, so a tiling compositor gives it a
# tile. The chat panel collapsed is the one that hurts: it paints a launcher
# bubble and leaves the rest transparent, so it looks like nothing at all while
# taking half the screen.
#
# The dashboard is titled exactly `Promethee`. Every overlay is titled
# `Promethee <role>`, which is what these rules match. That naming comes from
# the build; without it every window here is class `promethee` titled
# `Promethee` and none of this can be written.

windowrule = float, class:^(promethee)$, title:^(Promethee .+)$
windowrule = pin, class:^(promethee)$, title:^(Promethee .+)$

# An overlay must never take the keyboard: they are all `focusable: false`
# upstream, which Wayland does not carry.
windowrule = noinitialfocus, class:^(promethee)$, title:^(Promethee .+)$

# They draw their own shape, over your wallpaper, and most of that shape is
# nothing at all. Anything the compositor draws around a window lands on the
# transparent part instead, which is how an invisible window turns into a
# rounded rectangle floating over your terminal.
windowrule = bordersize 0, class:^(promethee)$, title:^(Promethee .+)$
windowrule = rounding 0, class:^(promethee)$, title:^(Promethee .+)$
windowrule = noshadow, class:^(promethee)$, title:^(Promethee .+)$
windowrule = noblur, class:^(promethee)$, title:^(Promethee .+)$
windowrule = noanim, class:^(promethee)$, title:^(Promethee .+)$
windowrule = opacity 1.0 override, class:^(promethee)$, title:^(Promethee .+)$

# Wayland has no way for a window to say where it wants to be, so the app's own
# placement is lost and Hyprland centres them. Upstream puts the chat 16px from
# the bottom left corner, under its launcher bubble.
windowrule = move 16 100%-h-16, title:^(Promethee Panel dm)$

# The other panels are yours to place, since where they belong depends on which
# corner you keep their launcher in:
#
# windowrule = move 100%-w-16 100%-h-16, title:^(Promethee Panel quests)$

# `pin` is upstream's `visibleOnAllWorkspaces`, as close as Hyprland gets: a
# pinned window follows you across the workspaces of its own monitor, not onto
# another screen. Drop the rule if you would rather keep the HUD on one.
#
# The roles, for rules of your own:
#
#   Promethee                   the dashboard, an ordinary window
#   Promethee HUD               the timer pill
#   Promethee Panel dm          the chat panel and its launcher bubble
#   Promethee Panel quests      the quest panel
#   Promethee Panel planning    the planning panel
#   Promethee Notifications     toasts
#   Promethee Session Complete  the end-of-session summary
#   Promethee Session End       the end-of-session effect
#   Promethee Poster            the shareable session image
#   Promethee Overlay           a role added upstream since this was written
