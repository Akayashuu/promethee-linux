name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: shellcheck
        run: shellcheck build.sh scripts/update-check.sh clients/quickshell/install.sh

      - name: syntax
        run: |
          node --check patches/linux-active-window.js
          node --check patches/promethee-control.js
          node --check scripts/patches.mjs
          node --check scripts/apply-patches.mjs
          node --check clients/promethee-ctl
          python3 -m py_compile scripts/extract-resources.py

      - name: patch anchors
        run: node scripts/anchors.test.mjs
